pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,tsx,js}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,js,css,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    stylelint:
      glob: "src/**/*.css"
      run: npx stylelint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
