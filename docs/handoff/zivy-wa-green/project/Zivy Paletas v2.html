<!-- Ícones inline estilo Lucide — fallback garantido no browser sem bundler -->
<script type="text/babel">
/* Ícones SVG inline com a mesma API do lucide-react:
   <IconName size color strokeWidth />
   Referência no codebase: import { X } from 'lucide-react' */
function mkIcon(paths) {
  return function LucideIcon({ size = 16, color = 'currentColor', strokeWidth = 2, style }) {
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size} height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke={color}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        dangerouslySetInnerHTML={{ __html: paths }}
      />
    );
  };
}

const Search        = mkIcon('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>');
const ChevronDown   = mkIcon('<path d="m6 9 6 6 6-6"/>');

<script type="text/babel">
/* ─────────────────────────────────────────────────────────
   Ícones via window.* (definidos no script de ícones acima)
   No codebase: import { Search, … } from 'lucide-react'
   Radix UI é ESM-only sem build de browser — os padrões
   visuais que produziria estão replicados abaixo com
   comentários apontando o componente Radix equivalente.
───────────────────────────────────────────────────────── */

/* Ícones por item de nav */
const NAV_ICONS    = [Inbox, Ticket, ClipboardCheck];
const STRUCT_ICONS = [Building2, LayoutGrid, MapPin];

function MiniDash({ p }) {
  const navItems    = ['Inbox', 'Tickets', 'Aprovações'];
  const structItems = ['Blocos', 'Unidades', 'Áreas'];
  const tickets = [
    { proto: 'TKT-041', title: 'Elevador parado — Bloco A', status: 'urgent', loc: 'Elevador Social' },
    { proto: 'TKT-040', title: 'Vazamento na garagem G1',   status: 'open',   loc: 'Garagem G1'      },
    { proto: 'TKT-039', title: 'Torneira não fecha',         status: 'done',   loc: 'Playground'      },
  ];

  const statusMeta = {
    urgent: { label: 'Urgente',   bg: p.urgentChipBg, color: p.danger    },
    open:   { label: 'Aberto',    bg: p.openBg,       color: p.openColor },
    done:   { label: 'Resolvido', bg: p.doneBg,       color: p.doneColor },
  };

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'grid',
      gridTemplateColumns: '148px 1fr',
      gridTemplateRows: '42px 1fr',
      gridTemplateAreas: '"header header" "sidebar main"',
      fontFamily: "'IBM Plex Sans', sans-serif",
      fontSize: 11,
      borderRadius: 10,
      overflow: 'hidden',
      border: `1px solid ${p.border}`,
    }}>

      {/* ── Header ── */}
      <div style={{
        gridArea: 'header',
        background: p.headerBg,
        borderBottom: `1px solid ${p.border}`,
        display: 'flex', alignItems: 'center',
        padding: '0 14px', gap: 10,
      }}>
        {/* Logo mark */}
        <div style={{
          width: 22, height: 22, borderRadius: 6,
          background: p.brand, color: p.brandFg,
          display: 'grid', placeItems: 'center',
          fontWeight: 700, fontSize: 11,
        }}>Z</div>
        <span style={{ fontWeight: 700, fontSize: 13, color: p.brand, letterSpacing: '-0.02em' }}>Zivy</span>

        {/* Condo switcher — Radix: <DropdownMenu.Root> */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 5,
          padding: '3px 8px', borderRadius: 6,
          border: `1px solid ${p.border}`,
          background: p.surface, color: p.fgSecondary, fontSize: 10,
          marginLeft: 6, cursor: 'default',
        }}>
          <div style={{ width: 14, height: 14, borderRadius: 4, background: p.brandSoft, color: p.brand, display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 8 }}>JR</div>
          <span style={{ color: p.fgPrimary, fontWeight: 500 }}>Res. Jardins</span>
          <ChevronDown size={10} color={p.fgTertiary} strokeWidth={2}/>
        </div>

        {/* Search — Radix: <Command> ou <Dialog> */}
        <div style={{
          flex: 1, maxWidth: 280,
          display: 'flex', alignItems: 'center', gap: 6,
          padding: '3px 10px', borderRadius: 6, height: 26,
          background: p.bgMuted, border: `1px solid ${p.border}`,
          color: p.fgTertiary, fontSize: 10, marginLeft: 4,
        }}>
          <Search size={10} color={p.fgTertiary} strokeWidth={2}/>
          <span>Buscar…</span>
          <span style={{ marginLeft: 'auto', fontFamily: 'monospace', fontSize: 9, opacity: 0.5 }}>⌘K</span>
        </div>

        <div style={{ marginLeft: 'auto', display: 'flex', gap: 6, alignItems: 'center' }}>
          {/* Bell — Radix: <Tooltip.Root> */}
          <div style={{ width: 26, height: 26, borderRadius: 6, display: 'grid', placeItems: 'center', color: p.fgTertiary }}>
            <Bell size={13} strokeWidth={1.8}/>
          </div>
          {/* Persona badge */}
          <div style={{ padding: '2px 8px', borderRadius: 999, background: p.brandSoft, color: p.brand, fontWeight: 500, fontSize: 9 }}>
            Administradora
          </div>
          {/* Avatar — Radix: <Avatar.Root> */}
          <div style={{ width: 26, height: 26, borderRadius: '50%', background: p.brandSoft, color: p.brand, display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 10 }}>CD</div>
        </div>
      </div>

      {/* ── Sidebar ── */}
      <div style={{
        gridArea: 'sidebar',
        background: p.sidebarBg,
        borderRight: `1px solid ${p.border}`,
        padding: '10px 6px',
        display: 'flex', flexDirection: 'column', gap: 1,
      }}>
        <div style={{ fontSize: 8, textTransform: 'uppercase', letterSpacing: '0.07em', color: p.fgTertiary, fontWeight: 600, padding: '6px 8px 4px' }}>Operação</div>
        {navItems.map((item, i) => {
          const Icon = NAV_ICONS[i];
          const active = i === 1;
          return (
            <div key={item} style={{
              display: 'flex', alignItems: 'center', gap: 7,
              padding: '5px 8px', borderRadius: 6, fontSize: 11, fontWeight: 500,
              background: active ? p.brandSoft : 'transparent',
              color: active ? p.brand : p.fgSecondary,
              cursor: 'default',
            }}>
              <Icon size={12} strokeWidth={active ? 2.2 : 1.8} color={active ? p.brand : p.fgTertiary}/>
              {item}
              {i === 0 && (
                <span style={{ marginLeft: 'auto', fontSize: 9, color: p.fgTertiary, background: p.bgMuted, padding: '0 4px', borderRadius: 999 }}>3</span>
              )}
            </div>
          );
        })}

        <div style={{ height: 1, background: p.border, margin: '6px 4px' }}/>
        <div style={{ fontSize: 8, textTransform: 'uppercase', letterSpacing: '0.07em', color: p.fgTertiary, fontWeight: 600, padding: '6px 8px 4px' }}>Estrutura</div>
        {structItems.map((item, i) => {
          const Icon = STRUCT_ICONS[i];
          return (
            <div key={item} style={{
              display: 'flex', alignItems: 'center', gap: 7,
              padding: '5px 8px', borderRadius: 6, fontSize: 11, fontWeight: 500,
              color: p.fgSecondary, cursor: 'default',
            }}>
              <Icon size={12} strokeWidth={1.8} color={p.fgTertiary}/>
              {item}
            </div>
          );
        })}
      </div>

      {/* ── Main ── */}
      <div style={{ gridArea: 'main', background: p.canvas, padding: '14px 16px', overflow: 'hidden' }}>
        {/* KPI row */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 12 }}>
          {[
            { lbl: 'Abertos',       num: '7',  hi: false,    Icon: CircleIcon     },
            { lbl: 'Em andamento',  num: '4',  hi: true,     Icon: AlertCircle    },
            { lbl: 'Resolvidos',    num: '12', hi: false,    Icon: CheckCircle2   },
            { lbl: 'Urgentes',      num: '2',  hi: 'urgent', Icon: AlertTriangle  },
          ].map(({ lbl, num, hi, Icon }) => (
            <div key={lbl} style={{
              background: p.surface, border: `1px solid ${p.border}`, borderRadius: 8, padding: '8px 10px',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 2 }}>
                <Icon size={10} strokeWidth={2}
                  color={hi === 'urgent' ? p.danger : hi ? p.brand : p.fgTertiary}/>
                <span style={{ fontSize: 8, textTransform: 'uppercase', letterSpacing: '0.06em', color: p.fgTertiary, fontWeight: 600 }}>{lbl}</span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-0.02em',
                color: hi === 'urgent' ? p.danger : hi ? p.brand : p.fgPrimary }}>{num}</div>
            </div>
          ))}
        </div>

        {/* Ticket list */}
        <div style={{ background: p.surface, border: `1px solid ${p.border}`, borderRadius: 8, overflow: 'hidden' }}>
          <div style={{
            display: 'grid', gridTemplateColumns: '80px 1fr 90px 60px',
            background: p.bgMuted, borderBottom: `1px solid ${p.border}`,
            padding: '6px 10px', gap: 8,
          }}>
            {['Protocolo','Chamado','Status','Prioridade'].map(h => (
              <div key={h} style={{ fontSize: 8, textTransform: 'uppercase', letterSpacing: '0.06em', color: p.fgTertiary, fontWeight: 600 }}>{h}</div>
            ))}
          </div>
          {tickets.map((t, i) => {
            const meta = statusMeta[t.status];
            return (
              <div key={t.proto} style={{
                display: 'grid', gridTemplateColumns: '80px 1fr 90px 60px',
                padding: '7px 10px', gap: 8, alignItems: 'center',
                borderBottom: i < tickets.length - 1 ? `1px solid ${p.border}` : 'none',
                background: i === 0 ? p.urgentBg : 'transparent',
              }}>
                <div style={{ fontFamily: 'monospace', fontSize: 9, color: p.fgTertiary }}>{t.proto}</div>
                <div>
                  <div style={{ fontSize: 10, fontWeight: 600, color: i === 0 ? p.danger : p.fgPrimary }}>{t.title}</div>
                  <div style={{ fontSize: 9, color: p.fgTertiary, marginTop: 1 }}>{t.loc}</div>
                </div>
                {/* Status badge — Radix: <Badge> (custom) */}
                <div>
                  <span style={{
                    display: 'inline-flex', alignItems: 'center', gap: 4,
                    padding: '2px 6px', borderRadius: 999, fontSize: 9, fontWeight: 600,
                    background: meta.bg, color: meta.color,
                  }}>
                    <span style={{ width: 5, height: 5, borderRadius: '50%', background: 'currentColor' }}/>
                    {meta.label}
                  </span>
                </div>
                {/* Priority bars */}
                <div style={{ display: 'flex', gap: 2, alignItems: 'flex-end' }}>
                  {[5,8,11].map((h,j) => (
                    <div key={j} style={{ width: 3, height: h, borderRadius: 1,
                      background: i === 0 ? (j <= 2 ? p.danger : p.border) : (j === 0 ? p.brand : p.border)
                    }}/>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {/* Actions — Radix: <Button> (Radix Themes) */}
        <div style={{ marginTop: 10, display: 'flex', gap: 6 }}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 5,
            padding: '5px 12px', borderRadius: 8,
            background: p.brand, color: p.brandFg,
            fontSize: 10, fontWeight: 600, cursor: 'default',
          }}>
            <Plus size={11} strokeWidth={2.5}/> Novo chamado
          </div>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 5,
            padding: '5px 12px', borderRadius: 8,
            background: p.surface, color: p.fgSecondary,
            border: `1px solid ${p.border}`,
            fontSize: 10, fontWeight: 500, cursor: 'default',
          }}>
            <Download size={11} strokeWidth={1.8}/> Exportar CSV
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   ThemePicker — seletor interativo de tema
───────────────────────────────────────────────────────── */
function ThemePicker() {
  const [active, setActive] = React.useState('F');
  const p = palettes[active];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', fontFamily: "'IBM Plex Sans', sans-serif" }}>
      {/* Selector bar */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        padding: '10px 14px',
        background: '#f4f4f8',
        borderBottom: '1px solid #e2e2ea',
        flexWrap: 'wrap',
      }}>
        <span style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600, color: '#9999b0', marginRight: 4 }}>Tema</span>
        {Object.entries(palettes).map(([key, theme]) => (
          <button key={key} onClick={() => setActive(key)} style={{
            display: 'flex', alignItems: 'center', gap: 5,
            padding: '4px 10px', borderRadius: 8, cursor: 'pointer',
            border: active === key ? `2px solid ${theme.brand}` : '1.5px solid #dcdce8',
            background: active === key ? theme.brandSoft : '#fff',
            fontFamily: "'IBM Plex Sans', sans-serif",
            fontSize: 10, fontWeight: active === key ? 700 : 500,
            color: active === key ? theme.brand : '#6b6b7d',
            transition: 'all 0.12s ease',
          }}>
            <div style={{
              width: 10, height: 10, borderRadius: 3, flexShrink: 0,
              background: theme.brand,
              boxShadow: active === key ? `0 0 0 2px ${theme.brandSoft}` : 'none',
            }}/>
            {key}
          </button>
        ))}
        <span style={{ marginLeft: 6, fontSize: 11, color: '#6b6b7d', fontStyle: 'italic' }}>{p.name}</span>
      </div>
      {/* Dashboard */}
      <div style={{ flex: 1, padding: 14 }}>
        <MiniDash p={p}/>
      </div>
    </div>
  );
}

/* Caption helper */
function SwatchRow({ p }) {
  const swatches = [
    { c: p.brand, lbl: 'brand' },
    { c: p.headerBg, lbl: 'header' },
    { c: p.sidebarBg, lbl: 'sidebar' },
    { c: p.canvas, lbl: 'canvas' },
    { c: p.surface, lbl: 'surface' },
    { c: p.fgPrimary, lbl: 'fg' },
    { c: p.danger, lbl: 'danger' },
  ];
  return (
    <div style={{ display: 'flex', gap: 4, padding: '8px 14px 6px' }}>
      {swatches.map(s => (
        <div key={s.lbl} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
          <div style={{ width: 18, height: 18, borderRadius: 4, background: s.c, border: '1px solid rgba(0,0,0,0.1)' }}/>
          <span style={{ fontSize: 8, color: '#6b6b7d', fontFamily: 'monospace' }}>{s.lbl}</span>
        </div>
      ))}
    </div>
  );
}
