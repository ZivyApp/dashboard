<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<body>
<div id="root"></div>
<script type="text/babel">

const PL   = '#37003c';
const PLm  = '#6b1a73';
const PLl  = '#b76dbf';
const ACC  = '#e90052';
const ink  = '#14141c';
const W    = '#ffffff';

/* ── Shared frame ─────────────────────────────────────────── */
function Frame({ bg = W, h = 160, children, style }) {
  return (
    <div style={{
      width: '100%', minHeight: h, background: bg,
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', gap: 28, padding: '28px 32px', ...style,
    }}>
      {children}
    </div>
  );
}
function Divider() {
  return <div style={{ width: '90%', height: 1, background: '#e5e5ec' }}/>;
}
function Caption({ children }) {
  return (
    <div style={{ background: '#f7f7fa', borderTop: '1px solid #e5e5ec', padding: '10px 18px', fontSize: 11, color: '#6b6b7d', fontFamily: 'Inter, sans-serif', width: '100%', lineHeight: 1.55 }}>
      {children}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   DIREÇÃO 03 — Wordmark dois pesos: Z brand + ivy light
   Variáveis: fonte, proporção de pesos, cor do Z, tagline
═══════════════════════════════════════════════════════════ */

/* Base: Z em cor de marca + resto leve, tipografia variável */
function W3({ scale=1, dark=false, font='Sora', wZ=800, wRest=300, colorZ=PL, colorRest=null, tagline=null }) {
  const fg = colorRest ?? (dark ? 'rgba(255,255,255,0.85)' : ink);
  const s  = n => n * scale;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: s(4) }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 0, lineHeight: 1 }}>
        <span style={{ fontFamily: `'${font}', sans-serif`, fontWeight: wZ, fontSize: s(38), color: dark ? W : colorZ, letterSpacing: '-0.045em' }}>Z</span>
        <span style={{ fontFamily: `'${font}', sans-serif`, fontWeight: wRest, fontSize: s(38), color: fg, letterSpacing: '-0.03em' }}>ivy</span>
      </div>
      {tagline && (
        <span style={{ fontFamily: 'Inter, sans-serif', fontWeight: 400, fontSize: s(10), color: dark ? 'rgba(255,255,255,0.45)' : '#8b8b9e', letterSpacing: '0.2em', textTransform: 'uppercase', marginTop: s(2) }}>
          {tagline}
        </span>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   DIREÇÃO 09 — Balão de mensagem com Z
   Variáveis: forma da cauda, estilo do balão, cor, Z grosso/fino
═══════════════════════════════════════════════════════════ */

/* Balão base — cauda para baixo-esquerda */
function Bubble({ scale=1, variant='round', fillA=PL, fillB=PL, strokeZ=W, zWeight=3.5, dark=false, word=true, font='Space Grotesk' }) {
  const s  = n => n * scale;
  const fg = dark ? W : PL;
  const id = `g_${Math.random().toString(36).slice(2,6)}`;
  const iGrad = fillA !== fillB;

  const bubble = {
    round: `M${s(6)} ${s(6)} H${s(38)} Q${s(42)} ${s(6)} ${s(42)} ${s(10)} V${s(28)} Q${s(42)} ${s(32)} ${s(38)} ${s(32)} H${s(20)} L${s(8)} ${s(42)} V${s(32)} H${s(6)} Q${s(2)} ${s(32)} ${s(2)} ${s(28)} V${s(10)} Q${s(2)} ${s(6)} ${s(6)} ${s(6)}Z`,
    square: `M${s(4)} ${s(4)} H${s(40)} V${s(32)} H${s(22)} L${s(8)} ${s(44)} V${s(32)} H${s(4)}Z`,
    pill:   `M${s(11)} ${s(6)} H${s(33)} Q${s(42)} ${s(6)} ${s(42)} ${s(14)} V${s(24)} Q${s(42)} ${s(32)} ${s(33)} ${s(32)} H${s(22)} L${s(8)} ${s(44)} V${s(32)} H${s(11)} Q${s(2)} ${s(32)} ${s(2)} ${s(24)} V${s(14)} Q${s(2)} ${s(6)} ${s(11)} ${s(6)}Z`,
    sharp:  `M${s(3)} ${s(3)} H${s(41)} V${s(31)} H${s(19)} L${s(6)} ${s(44)} V${s(31)} H${s(3)}Z`,
  }[variant] || '';

  const zPath = `M${s(11)} ${s(13)} H${s(33)} L${s(11)} ${s(25)} H${s(33)}`;

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: s(13) }}>
      <svg width={s(44)} height={s(46)} viewBox={`0 0 ${s(44)} ${s(46)}`} fill="none">
        {iGrad && (
          <defs>
            <linearGradient id={id} x1="0" y1="0" x2={s(44)} y2={s(44)} gradientUnits="userSpaceOnUse">
              <stop stopColor={fillA}/><stop offset="1" stopColor={fillB}/>
            </linearGradient>
          </defs>
        )}
        <path d={bubble} fill={iGrad ? `url(#${id})` : fillA}/>
        <path d={zPath} stroke={strokeZ} strokeWidth={zWeight} strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      {word && (
        <span style={{ fontFamily: `'${font}', sans-serif`, fontWeight: 700, fontSize: s(26), color: fg, letterSpacing: '-0.025em' }}>
          Zivy
        </span>
      )}
    </div>
  );
}

      {/* ── SECÇÃO B: Dir 09 — balão de mensagem ───────────── */}
