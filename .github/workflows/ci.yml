name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_CORE_API_URL: https://core-production-c748.up.railway.app
        run: npm run build

  verify-api-types:
    name: Verify generated API types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Check de consistência interna (offline): src/api/types.ts deve ser
      # exatamente a saída de `npm run gen:api` a partir do openapi.json committed.
      # Pega o erro comum (editar openapi.json e esquecer de regerar, ou editar
      # types.ts à mão). Drift vs o Core upstream NÃO é checado aqui — exige um
      # Core vivo; faça localmente com `npm run sync:swagger` contra o Core local.
      - name: Regenerate types from committed openapi.json
        run: npm run gen:api

      - name: Fail if types.ts drifted from openapi.json
        run: |
          if ! git diff --quiet src/api/types.ts; then
            echo "::error::src/api/types.ts está fora de sync com src/api/openapi.json. Rode 'npm run gen:api' e commite o resultado."
            git diff --stat src/api/
            git diff src/api/types.ts
            exit 1
          fi
